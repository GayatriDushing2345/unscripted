spring.application.name=Unscripted
server.port=8081

# --- MONGODB CONFIGURATION ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/unscripted}
spring.data.mongodb.auto-index-creation=true

# --- OFFICIAL O*NET WEB SERVICES API CONFIGURATION ---
# Base URL for O*NET Web Services
onet.api.base-url=https://services.onetcenter.org/ws/
# Provide your O*NET Web Services credentials via environment variables:
# ONET_USERNAME and ONET_PASSWORD
# When not set, Unscripted smoothly runs using the embedded authentic O*NET 29.0 database.
onet.api.username=${ONET_USERNAME:}
onet.api.password=${ONET_PASSWORD:}
onet.api.timeout-seconds=5