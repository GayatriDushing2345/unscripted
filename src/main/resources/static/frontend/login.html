<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unscripted | Login</title>

  <!-- Styles -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
</head>

<body>

  <!-- LAYOUT WRAPPER -->
  <div class="layout">

    <!-- LEFT NAVIGATION -->
    <nav class="sidebar">
      <h2 class="logo">Unscripted</h2>

      <ul class="nav-list">
        <li>Overview</li>
        <li class="active">Login</li>
        <li>Journey</li>
        <li>Dashboard</li>
        <li>Result</li>
      </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="content">

      <!-- PAGE HEADER -->
      <header class="page-header">
        <h1>Login</h1>
        <p>
          Sign in to start your journey.
        </p>
      </header>

      <!-- LOGIN CARD -->
      <section class="card">

        <label class="input-label">Email</label>
        <input
          type="email"
          class="input-field"
          placeholder="you@example.com"
        />

        <label class="input-label">Password</label>
        <input
          type="password"
          class="input-field"
          placeholder="••••••••"
        />

        <button
          class="primary-btn"
          onclick="location.href='journey.html'"
        >
          Login
        </button>

      </section>

    </main>

  </div>

</body>
</html>
